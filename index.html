<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Premium Direct Link Generator</title>
    <script src="https://gstatic.com"></script>
    <script src="https://gstatic.com"></script>
    <script src="https://unpkg.com" type="module"></script>
    <style>
        :root { --primary: #6366f1; --bg: #0f172a; --card: #1e293b; }
        body { font-family: 'Inter', sans-serif; background: var(--bg); color: white; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; overflow: hidden; }
        .glass-card { background: var(--card); border: 1px solid rgba(255,255,255,0.1); padding: 40px; border-radius: 24px; box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5); text-align: center; width: 400px; position: relative; z-index: 10; animation: slideUp 0.8s ease-out; }
        @keyframes slideUp { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }
        .upload-area { border: 2px dashed rgba(255,255,255,0.2); border-radius: 16px; padding: 30px; cursor: pointer; transition: 0.3s; margin-bottom: 20px; }
        .upload-area:hover { border-color: var(--primary); background: rgba(99, 102, 241, 0.05); }
        .progress-container { height: 8px; background: #334155; border-radius: 10px; margin: 20px 0; display: none; overflow: hidden; }
        #progressBar { height: 100%; width: 0%; background: var(--primary); transition: 0.3s; }
        .link-box { background: #0f172a; padding: 15px; border-radius: 12px; display: none; animation: fadeIn 0.5s; margin-top: 10px; border: 1px solid var(--primary); }
        .link-box a { color: #818cf8; text-decoration: none; word-break: break-all; font-size: 14px; font-weight: 600; }
        .btn { background: var(--primary); color: white; border: none; padding: 12px 24px; border-radius: 10px; font-weight: 600; cursor: pointer; width: 100%; transition: 0.3s; }
        .btn:hover { filter: brightness(1.2); transform: scale(1.02); }
    </style>
</head>
<body>

<div class="glass-card">
    <dotlottie-player src="https://lottie.host" background="transparent" speed="1" style="width: 150px; height: 150px; margin: 0 auto;" loop autoplay></dotlottie-player>
    <h1>Direct Link Cloud</h1>
    <p style="color: #94a3b8;">Upload APK, ZIP, Video, or Audio</p>
    
    <div class="upload-area" onclick="document.getElementById('fileInput').click()">
        <p>Drop file here or <span style="color: var(--primary);">Browse</span></p>
        <input type="file" id="fileInput" hidden onchange="uploadFile()">
    </div>

    <div class="progress-container" id="progressContainer">
        <div id="progressBar"></div>
    </div>

    <div class="link-box" id="linkBox">
        <p style="font-size: 12px; margin-top: 0;">✅ Direct Download Link Ready:</p>
        <a id="downloadLink" href="#" target="_blank">Generating...</a>
        <button class="btn" style="margin-top: 15px;" onclick="copyLink()">Copy Link</button>
    </div>
</div>

<script>
    // 1. Paste your Firebase Config here
    const firebaseConfig = {
        apiKey: "YOUR_API_KEY",
        authDomain: "YOUR_://firebaseapp.com",
        projectId: "YOUR_PROJECT_ID",
        storageBucket: "YOUR_://appspot.com",
        appId: "YOUR_APP_ID"
    };

    firebase.initializeApp(firebaseConfig);
    const storage = firebase.storage();

    async function uploadFile() {
        const file = document.getElementById('fileInput').files[0];
        if (!file) return;

        const progressContainer = document.getElementById('progressContainer');
        const progressBar = document.getElementById('progressBar');
        const linkBox = document.getElementById('linkBox');
        const downloadLink = document.getElementById('downloadLink');

        progressContainer.style.display = 'block';
        linkBox.style.display = 'none';

        // Create storage reference
        const storageRef = storage.ref('uploads/' + Date.now() + "_" + file.name);
        const uploadTask = storageRef.put(file);

        uploadTask.on('state_changed', 
            (snapshot) => {
                const progress = (snapshot.bytesTransferred / snapshot.totalBytes) * 100;
                progressBar.style.width = progress + '%';
            }, 
            (error) => alert("Upload failed: " + error.message), 
            async () => {
                const url = await uploadTask.snapshot.ref.getDownloadURL();
                // Modify URL for direct download
                const directUrl = url + "&download=1"; 
                downloadLink.href = directUrl;
                downloadLink.innerText = directUrl;
                linkBox.style.display = 'block';
                progressContainer.style.display = 'none';
            }
        );
    }

    function copyLink() {
        const link = document.getElementById('downloadLink').href;
        navigator.clipboard.writeText(link);
        alert("Link copied to clipboard!");
    }
</script>
</body>
</html>
