<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ULTIMATE DIRECT DOWNLOADER</title>
    <!-- Firebase Legacy Scripts for better compatibility -->
    <script src="https://gstatic.com"></script>
    <script src="https://gstatic.com"></script>
    <style>
        :root { --primary: #00f2fe; --secondary: #4facfe; --dark: #0a0b10; }
        body { background: var(--dark); color: white; font-family: 'Segoe UI', sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .card { background: #161b22; border: 1px solid #30363d; border-radius: 20px; padding: 40px; width: 450px; text-align: center; box-shadow: 0 20px 50px rgba(0,0,0,0.5); }
        h1 { background: linear-gradient(to right, var(--primary), var(--secondary)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; font-size: 28px; margin-bottom: 10px; }
        .drop-zone { border: 2px dashed #30363d; padding: 40px; border-radius: 15px; cursor: pointer; transition: 0.3s; margin: 20px 0; }
        .drop-zone:hover { border-color: var(--primary); background: rgba(0, 242, 254, 0.05); }
        .progress-bar { width: 100%; height: 10px; background: #21262d; border-radius: 5px; display: none; overflow: hidden; margin: 15px 0; }
        #progressFill { width: 0%; height: 100%; background: var(--primary); box-shadow: 0 0 10px var(--primary); transition: 0.2s; }
        .result-box { display: none; background: #0d1117; padding: 15px; border-radius: 10px; border: 1px solid var(--primary); margin-top: 20px; }
        .link-text { color: var(--primary); word-break: break-all; font-size: 13px; display: block; margin-bottom: 10px; text-decoration: none; }
        .btn-copy { background: linear-gradient(45deg, var(--secondary), var(--primary)); color: black; border: none; padding: 12px 20px; border-radius: 8px; font-weight: bold; cursor: pointer; width: 100%; }
        .status { font-size: 14px; color: #8b949e; }
    </style>
</head>
<body>

<div class="card">
    <h1>SKY DOWNLOADER</h1>
    <p class="status">Upload APK, ZIP, MP4, MP3, etc.</p>

    <div class="drop-zone" onclick="document.getElementById('fileInput').click()">
        <p id="fileNameDisplay">Click to Select File</p>
        <input type="file" id="fileInput" hidden onchange="startUpload()">
    </div>

    <div class="progress-bar" id="progressBar">
        <div id="progressFill"></div>
    </div>

    <div class="result-box" id="resultBox">
        <span style="font-size: 12px; color: #aaa;">DIRECT DOWNLOAD LINK:</span>
        <a href="#" id="finalLink" class="link-text" target="_blank"></a>
        <button class="btn-copy" onclick="copyLink()">COPY DIRECT LINK</button>
    </div>
</div>

<script>
    // ======= PASTE YOUR FIREBASE CONFIG BELOW =======
    const firebaseConfig = {
        apiKey: "PASTE_HERE",
        authDomain: "PASTE_HERE",
        projectId: "PASTE_HERE",
        storageBucket: "PASTE_HERE",
        messagingSenderId: "PASTE_HERE",
        appId: "PASTE_HERE"
    };
    // ================================================

    firebase.initializeApp(firebaseConfig);
    const storage = firebase.storage();

    function startUpload() {
        const fileInput = document.getElementById('fileInput');
        const file = fileInput.files[0];
        if (!file) return;

        document.getElementById('fileNameDisplay').innerText = file.name;
        const progressFill = document.getElementById('progressFill');
        const progressBar = document.getElementById('progressBar');
        const resultBox = document.getElementById('resultBox');
        
        progressBar.style.display = 'block';
        resultBox.style.display = 'none';

        // Create a storage ref
        const storageRef = storage.ref('files/' + Date.now() + "_" + file.name);
        const uploadTask = storageRef.put(file);

        uploadTask.on('state_changed', 
            (snapshot) => {
                const percent = (snapshot.bytesTransferred / snapshot.totalBytes) * 100;
                progressFill.style.width = percent + '%';
            }, 
            (error) => { alert("Error: " + error.message); }, 
            () => {
                uploadTask.snapshot.ref.getDownloadURL().then((downloadURL) => {
                    // This creates the direct download trigger
                    const directLink = downloadURL; 
                    const linkElement = document.getElementById('finalLink');
                    
                    linkElement.href = directLink;
                    linkElement.innerText = directLink;
                    
                    resultBox.style.display = 'block';
                    progressBar.style.display = 'none';
                });
            }
        );
    }

    function copyLink() {
        const copyText = document.getElementById('finalLink').innerText;
        navigator.clipboard.writeText(copyText);
        alert("Link Copied! You can now share this for automatic download.");
    }
</script>

</body>
</html>
